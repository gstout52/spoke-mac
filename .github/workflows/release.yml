name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Only builds from this repo (never forks) publish releases.
    if: github.repository_owner == 'gstout52'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build universal app
        env:
          SPOKE_UNIVERSAL: "1"
          SPOKE_VERSION: 0.1.${{ github.run_number }}
          SPOKE_BUILD: ${{ github.run_number }}
        run: |
          ./scripts/build.sh
          ditto -c -k --keepParent build/Spoke.app Spoke-mac.zip

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spoke for Mac build ${{ github.run_number }}
          files: Spoke-mac.zip
          make_latest: true
